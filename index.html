<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEEFSTORE</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .store-sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .section-title {
            color: #f43f5e;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: left;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
        }
        .app-card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 12px 18px;
            margin: 10px auto;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .app-info {
            text-align: left;
        }
        .app-name {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }
        .app-desc {
            font-size: 12px;
            color: #94a3b8;
        }
        .install-btn {
            background-color: #0284c7;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .install-btn:hover {
            background-color: #0369a1;
        }
        .profile-btn {
            background-color: #e11d48;
        }
        .profile-btn:hover {
            background-color: #be123c;
        }
    </style>
</head>
<body>

    <h1>YUSEEFSTORE</h1>
    <div class="store-sub">Official Direct Install Store</div>

    <!-- پشکا پاراستنێ -->
    <div class="section-title">🛡️ Anti-Revoke Protection</div>
    <div class="app-card">
        <div class="app-info">
            <div class="app-name">YUSEEFSTORE DNS</div>
            <div class="app-desc">Valid for 1 Year (Anti-Revoke)</div>
        </div>
        <a class="install-btn profile-btn" href="https://r-german1.github.io/YUSEEF_STORE/profile.mobileconfig">Install</a>
    </div>

    <!-- پشکا بەرنامەیان -->
    <div class="section-title">📱 Apps & Games</div>

    <!-- یاری یان ئەپا تە -->
    <div class="app-card">
        <div class="app-info">
            <div class="app-name">YUSEEFSTORE App</div>
            <div class="app-desc">Direct Install from Store</div>
        </div>
        <a class="install-btn" href="itms-services://?action=download-manifest&url=https://r-german1.github.io/YUSEEF_STORE/app.plist">Install</a>
    </div>

</body>
</html>
